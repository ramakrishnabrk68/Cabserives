    <lightning-card title="Cab Booking" icon-name="custom:custom63">

            </div>
            <div class="slds-grid slds-wrap slds-flex-container">

                </div>

                        class="slds-box slds-box_small slds-reschedule">Reschedule
                        Record</span>
                </div>
                <div class="slds-col slds-4-of-12">
                    <img src={Cancelled}

                        class="slds-image"
                        onclick={handleClicl}
                        style="height: 200px; width: 200px;" /><br>
                    <span
                        class="slds-box slds-box_small slds-cancelled">Cancelled
                        Record</span>
                </div>

            </div>
        </div>
    </lightning-card>
</template>
